services:
  python-service:
    build:
      context: ./python-service
    environment:
      PORT: 5000
      PYTHON_HOST: 0.0.0.0
      MAX_CONTENT_LENGTH: 1048576
      MAX_EXPERIENCES: 100
      MAX_USER_VIBES: 50
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  web:
    build:
      context: .
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      PYTHON_SERVICE_URL: http://python-service:5000
      PYTHON_SERVICE_TIMEOUT_MS: ${PYTHON_SERVICE_TIMEOUT_MS:-8000}
      DISABLE_PYTHON_SPAWN: "true"
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-1048576}
      RATE_LIMIT_LOGIN_WINDOW_MS: ${RATE_LIMIT_LOGIN_WINDOW_MS:-900000}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_REGISTER_WINDOW_MS: ${RATE_LIMIT_REGISTER_WINDOW_MS:-900000}
      RATE_LIMIT_REGISTER_MAX: ${RATE_LIMIT_REGISTER_MAX:-15}
      RATE_LIMIT_VERIFY_WINDOW_MS: ${RATE_LIMIT_VERIFY_WINDOW_MS:-900000}
      RATE_LIMIT_VERIFY_MAX: ${RATE_LIMIT_VERIFY_MAX:-5}
      RATE_LIMIT_RECOMMENDATION_WINDOW_MS: ${RATE_LIMIT_RECOMMENDATION_WINDOW_MS:-900000}
      RATE_LIMIT_RECOMMENDATION_MAX: ${RATE_LIMIT_RECOMMENDATION_MAX:-30}
      RATE_LIMIT_WEATHER_WINDOW_MS: ${RATE_LIMIT_WEATHER_WINDOW_MS:-900000}
      RATE_LIMIT_WEATHER_MAX: ${RATE_LIMIT_WEATHER_MAX:-30}
    ports:
      - "3000:3000"
    depends_on:
      python-service:
        condition: service_started
    restart: unless-stopped
